apiVersion: v1
kind: Namespace
metadata:
  name: caldova
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caldova-inventory
  namespace: caldova
  annotations:
    azure.workload.identity/client-id: "REPLACE_WITH_MANAGED_IDENTITY_CLIENT_ID"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caldova-inventory
  namespace: caldova
data:
  CALDOVA_DB_URL: "jdbc:postgresql://REPLACE_WITH_POSTGRES_HOST:5432/caldova_inventory?sslmode=require"
  CALDOVA_DB_USERNAME: "REPLACE_WITH_DATABASE_IDENTITY_OR_USER"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caldova-inventory
  namespace: caldova
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caldova-inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caldova-inventory
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: caldova-inventory
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: REPLACE_WITH_REGISTRY/caldova-inventory:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: caldova-inventory
          env:
            - name: CALDOVA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caldova-db
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: caldova-inventory
---
apiVersion: v1
kind: Service
metadata:
  name: caldova-inventory
  namespace: caldova
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: caldova-inventory
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: caldova-inventory
  namespace: caldova
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: caldova-inventory
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
