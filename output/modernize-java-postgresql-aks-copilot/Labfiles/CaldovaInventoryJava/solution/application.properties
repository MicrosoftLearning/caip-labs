spring.application.name=caldova-inventory
server.port=8080

# Fail at startup when the deployment does not provide the required database settings.
spring.datasource.url=${CALDOVA_DB_URL}
spring.datasource.username=${CALDOVA_DB_USERNAME}
spring.datasource.password=${CALDOVA_DB_PASSWORD}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
